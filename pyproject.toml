[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtrack-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for JetBrains YouTrack — let Claude and other MCP clients read, create and resolve your issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "m0rp3x" }]
keywords = ["mcp", "youtrack", "jetbrains", "claude", "llm", "issue-tracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/m0rp3x/youtrack-mcp-server"
Repository = "https://github.com/m0rp3x/youtrack-mcp-server"
Issues = "https://github.com/m0rp3x/youtrack-mcp-server/issues"

[project.scripts]
# `youtrack-mcp-server` matches the PyPI name so `uvx youtrack-mcp-server` just works;
# `youtrack-mcp` is a short alias for the same entry point.
youtrack-mcp-server = "youtrack_mcp.server:main"
youtrack-mcp = "youtrack_mcp.server:main"
youtrack-admin = "youtrack_mcp.admin_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["youtrack_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
